services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    env_file: backend/api/.env
    depends_on:
      - redis
    ports:
      - "4000:4000"
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: bot/.env
    depends_on:
      - api
      - redis
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: frontend/.env.local
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  redis-data: