services:
  - type: web
    name: ggs-control-api
    runtime: node
    rootDir: backend/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BOT_API_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: ggs-dashboard
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DISCORD_CLIENT_ID
        sync: false
  - type: worker
    name: ggs-control-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: CONTROL_API_URL
        sync: false
      - key: BOT_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
  - type: worker
    name: ggs-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python CodeX.py
    envVars:
      - key: TOKEN
        sync: false
      - key: TARGET_STATUS
        sync: false
      - key: ROLE_ID
        sync: false
      - key: DATA_DIR
        value: /data
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_URI
        sync: false
      - key: LAVALINK_URL
        sync: false
      - key: LAVALINK_PASSWORDS
        sync: false
      - key: LAVALINK_URIS
        sync: false
